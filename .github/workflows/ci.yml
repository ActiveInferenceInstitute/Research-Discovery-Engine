name: ci

# Billing is locked org-wide for this estate, so these workflows are a mirror of
# the local gate, not its authority. `./run.sh <arm>` is the single definition of
# every command below; this file only supplies interpreters and checkouts.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: gate (node 24, locked install)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: DE/package-lock.json

      - name: Install from the lockfile
        working-directory: DE
        run: npm ci

      # The llm subset needs a provider key; `fast` runs unit, integration and
      # validation only, and asserts each report says `Failed: 0`.
      - name: Test harness subsets
        run: ./run.sh fast

      # prebuild (sync-kg.mjs), tsc, vite build and postbuild
      # (sync-kg.mjs --check-dist), which asserts dist/KG.
      - name: Build and assert the knowledge base in dist
        run: ./run.sh build

      - name: Relative Markdown links and anchors
        run: ./run.sh docs

  website:
    name: website build (next 16, locked install)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: website_explore_the_unknown/package-lock.json

      - name: Install from the lockfile
        working-directory: website_explore_the_unknown
        run: npm ci

      - name: Build the Next.js site
        run: ./run.sh website

  # GNN pin: .github/gnn-pin.json (schema gnn-importer-pin/v1, v5.0.3,
  # 8f293d9ba810e6eda5c09842d9c7ed9ffa5f92c1). What this job parses is
  # recorded in .github/GNN.md.
  gnn-conformance:
    name: gnn conformance (pinned)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The estate's pinned uv/CPython setup. Caching is off: this repository has
      # no uv.lock, so the default cache key would match nothing.
      - name: Set up Python with uv
        uses: ActiveInferenceInstitute/.github/.github/actions/setup-python-uv@7159e67315330aac8e414aebae0ad1e999a41448
        with:
          python-version: "3.12"
          enable-cache: "false"

      # The pinned parser requires >=3.11,<3.15, so the arm is handed the
      # uv-installed interpreter instead of the runner's default `python`.
      - name: Pinned parser conformance
        run: GNN_PYTHON="$(uv python find 3.12)" ./run.sh gnn
