# AII sidecar — InstituteOS metadata. Schema: aii_platform.aii_sidecar
meta:
  sidecar_version: 1.2.1
  updated: '2026-11-12'
repo:
  name: Research-Discovery-Engine
  slug: research-discovery-engine
  full_name: ActiveInferenceInstitute/Research-Discovery-Engine
  description: 'Research prototypes for exploring scientific knowledge as structured,
    connected information: a React/TypeScript knowledge-graph frontend, a Python network-analysis
    pipeline, and design documentation for a Conceptual Nexus Model.'
institute:
  category: research
  maturity: released
  steward: Active Inference Institute
ecosystem:
  relations:
  - repo: ActiveInferenceInstitute/InstituteOS
    relation: referenced-by
    note: Federated via the InstituteOS .aii manifest.
  links:
    github: https://github.com/ActiveInferenceInstitute/Research-Discovery-Engine
    website: https://www.activeinference.org
artifacts:
- path: README.md
  kind: doc
  description: Repository overview.
- path: AGENTS.md
  kind: doc
  description: Agent guidance.
- path: LICENSE
  kind: doc
  description: License.
- path: DE
  kind: code
  description: React/TypeScript/Vite Discovery Engine frontend and its tests.
- path: path
  kind: code
  description: Python network-analysis pipeline and checked-in results.
- path: resnei
  kind: code
  description: Flask ResNei prototype.
- path: website_explore_the_unknown
  kind: code
  description: Next.js website prototype.
- path: Docs
  kind: doc
  description: Numbered Discovery Engine system-design series.
- path: requirements.txt
  kind: code
  description: Root Python requirements.
provenance:
  license: CC-BY-4.0
  citation:
    doi: 10.5281/zenodo.15084931
    zenodo: https://zenodo.org/badge/latestdoi/948595787
    text: Active Inference Institute — Research-Discovery-Engine.
instituteos:
  tags:
  - research-discovery
  - knowledge-graph
  - literature
  - intellide
  - python
capabilities:
- documentation
- ci
tasks:
  fast:
    cmd: ./run.sh fast
    description: Run the credential-free unit, integration and validation harness subsets.
  build:
    cmd: ./run.sh build
    description: Build the Discovery Engine frontend and assert the knowledge base in dist.
  website:
    cmd: ./run.sh website
    description: Build the Next.js website.
  docs:
    cmd: ./run.sh docs
    description: Check relative links and pinned Publishing artifacts; index is Docs/documentation-index.md.
  gnn:
    cmd: ./run.sh gnn
    description: Run parser conformance using .github/gnn-pin.json.
  lint:
    cmd: ./run.sh lint
    description: Run DE ESLint; admitted red and excluded from all.
  types:
    cmd: ./run.sh types
    description: Run DE TypeScript checks; admitted red and excluded from all.
  metrics:
    cmd: ./run.sh metrics
    description: Measure gate arms and regenerate Docs/GATE_METRICS.md.
  all:
    cmd: ./run.sh all
    description: Run the blocking gate; this member has no manuscript command.
  strict:
    cmd: ./run.sh strict
    description: Run all plus the admitted-red lint and types arms.
docs:
- README.md
- AGENTS.md
- .aii/docs/INTEGRATION.md
- Docs/README.md
- .aii/docs/AGENTS.md
- Docs/documentation-index.md
- Docs/workflows/publishing.md
schema: aii-sidecar/v1
